services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: academia_db
    environment:
      POSTGRES_USER:     ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB:       ${DB_NAME:-academia_danza}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-academia_danza}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Backend Spring Boot ──────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: academia_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE:   prod
      SPRING_DATASOURCE_URL:    jdbc:postgresql://db:5432/${DB_NAME:-academia_danza}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password123}
      JWT_SECRET:               ${JWT_SECRET:-EstaEsUnaClaveSecretaMuyLargaYSeguraParaNuestraAcademiaEpifaniaDanza2026}
      MAIL_PASSWORD:            ${MAIL_PASSWORD:-}
      APP_FRONTEND_URL:         ${APP_FRONTEND_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend React (nginx) ───────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: academia_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
