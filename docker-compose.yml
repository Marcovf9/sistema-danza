services:

  # ── MySQL (compatible con TiDB en producción) ────────────────────────────────
  db:
    image: mysql:8.0
    container_name: academia_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER:          ${DB_USER:-admin}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-password123}
      MYSQL_DATABASE:      ${DB_NAME:-academia_danza}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-admin}", "-p${DB_PASSWORD:-password123}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Backend Spring Boot ──────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: academia_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE:     prod
      SPRING_DATASOURCE_URL:      jdbc:mysql://db:3306/${DB_NAME:-academia_danza}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password123}
      JWT_SECRET:                 ${JWT_SECRET:-REEMPLAZAR_CON_OPENSSL_rand_base64_64}
      MAIL_PASSWORD:              ${MAIL_PASSWORD:-}
      APP_FRONTEND_URL:           ${APP_FRONTEND_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS:       ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL:                ${ADMIN_EMAIL:-directora@example.com}
      ADMIN_PASSWORD:             ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend React (nginx) ───────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: academia_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
