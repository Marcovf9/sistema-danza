name: CI — Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_USER: admin
          MYSQL_PASSWORD: password123
          MYSQL_DATABASE: academia_danza_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u admin -ppassword123"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & test
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL:      jdbc:mysql://localhost:3306/academia_danza_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: password123
          JWT_SECRET:                 ci-secret-key-para-tests-no-usar-en-produccion
          MAIL_PASSWORD:              ""
        run: mvn verify -B

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20 + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Docker build check (solo en main) ────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend -t academia-backend:ci

      - name: Build frontend image
        run: docker build ./frontend -t academia-frontend:ci
