# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Base de datos ──────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/academia_danza}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:EstaEsUnaClaveSecretaMuyLargaYSeguraParaNuestraAcademiaEpifaniaDanza2026}

# ── Correo SMTP Gmail ──────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=epifaniadanceart@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── URL base del frontend (para links en emails) ───────────────────────────────
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}